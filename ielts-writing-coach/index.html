<!DOCTYPE html>
<title>IELTS Writing Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#EDF0F1; --ink:#17212C; --ink-2:#465361; --ink-3:#77838F;
  --line:#DBE0E3; --line-2:#C9D0D5; --accent:#2B4C7E; --accent-hover:#223D66; --accent-soft:#E5EBF4; --accent-ink:#FFFFFF;
  --ok:#2A7549; --ok-soft:#E2F1E7; --bad:#AF2A21; --bad-soft:#FBE8E5; --warn:#8F5E00; --warn-soft:#FBF0D8;
  --shadow:0 1px 2px rgba(20,32,48,.05),0 6px 18px rgba(20,32,48,.05);
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-en:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151B; --surface:#171F28; --surface-2:#1E2731; --ink:#E5EAF0; --ink-2:#AFB9C4; --ink-3:#7E8A96;
    --line:#29333E; --line-2:#36414D; --accent:#90AFE0; --accent-hover:#A9C2EA; --accent-soft:#1E2B3F; --accent-ink:#0D1520;
    --ok:#74C394; --ok-soft:#16302A; --bad:#F2887E; --bad-soft:#3A1E1B; --warn:#E5B862; --warn-soft:#33281486;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151B; --surface:#171F28; --surface-2:#1E2731; --ink:#E5EAF0; --ink-2:#AFB9C4; --ink-3:#7E8A96;
  --line:#29333E; --line-2:#36414D; --accent:#90AFE0; --accent-hover:#A9C2EA; --accent-soft:#1E2B3F; --accent-ink:#0D1520;
  --ok:#74C394; --ok-soft:#16302A; --bad:#F2887E; --bad-soft:#3A1E1B; --warn:#E5B862; --warn-soft:#33281486;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:700;letter-spacing:.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:28px 18px;display:flex;flex-direction:column;gap:28px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding-inline:10px}
.brand .mark{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.brand .name{font-family:var(--f-en);font-size:21px;font-weight:600;line-height:1.25;letter-spacing:-.005em}
.brand .ver{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button .ix{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);width:18px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav button[aria-current="page"] .ix{color:var(--accent)}
.cycle{margin-top:auto;padding:16px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.cycle h4{margin:0 0 10px;font-size:11px;font-family:var(--f-mono);letter-spacing:.12em;color:var(--ink-3);font-weight:500;text-transform:uppercase}
.cycle ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.cycle li{display:flex;gap:8px}
.cycle li span{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);padding-top:1px;width:14px;flex:none}
.cycle li.on{color:var(--accent);font-weight:700}
.cycle li.on span{color:var(--accent)}

.main{padding-block:40px 80px;padding-inline:clamp(16px,4vw,56px);min-width:0}
.page{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.page-head{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.page-head h1{font-size:28px;line-height:1.35}
.page-head p{color:var(--ink-2);max-width:62ch}

/* ---------- common ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:28px}
.label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);padding:9px 16px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.lg{padding:16px 28px;font-size:16.5px;font-weight:700;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:12.5px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;font-weight:500}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.en{font-family:var(--f-en)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:10px;font-size:13.5px;line-height:1.6}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.notice b{font-weight:700}

/* ---------- write page ---------- */
.write-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.form{display:flex;flex-direction:column;gap:30px}
.field{display:flex;flex-direction:column;gap:10px}
.field-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.field-head h2{font-size:14px;font-family:var(--f-mono);letter-spacing:.12em;font-weight:500;color:var(--ink-2)}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-2);border-radius:10px;padding:4px;background:var(--surface-2);gap:4px;width:min(460px,100%)}
.seg button{border:0;background:transparent;border-radius:7px;padding:10px 14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;line-height:1.35;color:var(--ink-2)}
.seg button b{font-size:15px;color:var(--ink)}
.seg button small{font-size:12px;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] b{color:var(--accent)}
textarea{width:100%;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:16px 18px;resize:vertical;line-height:1.75}
textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#q{min-height:110px;font-family:var(--f-en);font-size:15.5px}
#sq{min-height:140px;font-size:14.5px}
#ans{min-height:420px;font-family:var(--f-en);font-size:16px;line-height:1.85}
.wc{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.wc .num{font-family:var(--f-mono);font-size:14px;color:var(--ink-2)}
.wc .num b{font-family:var(--f-en);font-size:24px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;margin-inline:4px}
.wc .bar{flex:1 1 160px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:120px}
.wc .bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .2s}
.wc.under .bar i{background:var(--warn)}
.wc .state{font-size:13px;font-weight:700;color:var(--ok)}
.wc.under .state{color:var(--warn)}
.submit{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.progress{display:flex;flex-direction:column;gap:14px;padding:22px 24px}
.progress .steps{display:flex;flex-direction:column;gap:8px;font-size:14px}
.progress .steps div{display:flex;gap:10px;align-items:center;color:var(--ink-3)}
.progress .steps div.on{color:var(--ink);font-weight:700}
.progress .steps div.done{color:var(--ok)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.on .dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.aside{display:flex;flex-direction:column;gap:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px)}
.aside .card{padding:20px}
.aside h3{font-size:14px;margin-bottom:12px}
.hist{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.hist button{border:0;background:transparent;text-align:left;padding:10px 8px;border-radius:8px;cursor:pointer;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.hist button:hover{background:var(--surface-2)}
.hist .b{font-family:var(--f-en);font-size:20px;font-weight:600;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums}
.hist .t{font-size:12.5px;line-height:1.45;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hist .d{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.tips{margin:0;padding-left:1.2em;font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;line-height:1.6}

/* ---------- result page ---------- */
.res-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start}
.res-topic{font-family:var(--f-en);font-size:17px;line-height:1.65;max-width:70ch}
.res-sub{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.score{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0}
.score .overall{padding:30px 28px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;justify-content:center}
.score .overall .big{font-family:var(--f-en);font-size:84px;line-height:1;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score .crit{padding:26px 28px;display:flex;flex-direction:column;gap:22px;justify-content:center}
.crit-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.crit-cell{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:10px;background:var(--surface-2)}
.crit-cell .k{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--ink-3)}
.crit-cell .v{font-family:var(--f-en);font-size:32px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.crit-cell .n{font-size:11.5px;color:var(--ink-3);line-height:1.35}
.scale{display:flex;flex-direction:column;gap:6px}
.scale .track{display:grid;grid-template-columns:repeat(13,1fr);gap:3px}
.scale .track i{height:10px;border-radius:3px;background:var(--surface-2)}
.scale .track i.fill{background:var(--accent-soft)}
.scale .track i.cur{background:var(--accent)}
.scale .ticks{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);text-align:center}
.disclaimer{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;align-items:flex-start}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.section-head h2{font-size:21px}
.section-head p{color:var(--ink-2);font-size:14px}
.summary{font-size:15px;color:var(--ink-2);max-width:75ch}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.ccard{padding:24px 26px;display:flex;flex-direction:column;gap:16px}
.ccard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ccard-head .nm{display:flex;flex-direction:column}
.ccard-head .nm b{font-size:16.5px}
.ccard-head .band{font-family:var(--f-en);font-size:38px;font-weight:600;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.reason{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 14px;line-height:1.65}
.pts{display:flex;flex-direction:column;gap:6px}
.pts h4{margin:0;font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.pts.good h4{color:var(--ok)}
.pts.fix h4{color:var(--bad)}
.pts ul{margin:0;padding-left:1.15em;font-size:14px;display:flex;flex-direction:column;gap:4px;line-height:1.65}
.quote{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px dashed var(--line-2);border-radius:8px}
.quote q{font-family:var(--f-en);font-size:14.5px;quotes:"“" "”"}
.quote span{font-size:13px;color:var(--ink-2);line-height:1.6}
.top3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.t3{padding:26px;display:flex;flex-direction:column;gap:12px}
.t3 .n{font-family:var(--f-en);font-size:40px;line-height:1;font-weight:500;color:var(--accent)}
.t3 h3{font-size:17px;line-height:1.5}
.t3 p{font-size:14px;color:var(--ink-2);line-height:1.7}
.t3 .ev{margin-top:auto;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}
.t3 .ev q{font-family:var(--f-en);font-size:13.5px;color:var(--ink);display:block;margin-top:2px}
.essay{font-family:var(--f-en);font-size:16.5px;line-height:2.1;display:flex;flex-direction:column;gap:16px;max-width:78ch}
.essay p{overflow-wrap:break-word}
.fix,.fix del,.fix ins{display:inline;white-space:normal;text-decoration:none;background:none;padding:0;margin:0}
.fix del{color:var(--bad)}
.fix ins{color:var(--ok);font-weight:600}
.fix del .w,.fix del .sp{background:var(--bad-soft);text-decoration:line-through;text-decoration-thickness:1.5px}
.fix ins .w,.fix ins .sp{background:var(--ok-soft)}
.fix .w{white-space:nowrap;padding:1px 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend del{color:var(--bad);background:var(--bad-soft);padding:0 4px;border-radius:3px}
.legend ins{color:var(--ok);background:var(--ok-soft);padding:0 4px;border-radius:3px;text-decoration:none;font-weight:600}
.corr{display:flex;flex-direction:column}
.corr-item{display:grid;grid-template-columns:148px minmax(0,1fr) minmax(0,1fr);gap:18px;padding:16px 4px;border-top:1px solid var(--line);align-items:start}
.corr-item:first-child{border-top:0}
.corr-item .cat{padding-top:3px}
.bef,.aft{display:flex;gap:10px;font-family:var(--f-en);font-size:15px;line-height:1.6}
.bef .m,.aft .m{font-family:var(--f-ui);font-weight:700;flex:none;width:18px}
.bef{color:var(--bad)}
.bef span{text-decoration:line-through;text-decoration-thickness:1px}
.aft{color:var(--ok);font-weight:600}
.corr-item .why{grid-column:2 / -1;font-size:13px;color:var(--ink-2);margin-top:-8px}
.ideas2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px}
.used{padding:24px 26px;display:flex;flex-direction:column;gap:14px}
.used ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.used li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:14.5px}
.used li::before{content:"✓";color:var(--ok);font-weight:700}
.used li small{display:block;color:var(--ink-3);font-size:12.5px}
.others{padding:24px 26px;display:flex;flex-direction:column;gap:14px}
.others-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.oi{border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.oi b{font-size:14.5px}
.oi p{font-size:13px;color:var(--ink-2);line-height:1.6}
.oi .ue{font-family:var(--f-en);font-size:14px;color:var(--accent)}
.sample-flag{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:3px 10px;border-radius:999px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- topics page ---------- */
.filters{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;padding:20px 22px}
.filters .f{display:flex;flex-direction:column;gap:6px;min-width:0}
.filters select,.filters input{border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:8px 12px;min-width:150px;max-width:100%}
.filters input{min-width:200px}
.diff-seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.diff-seg button{border:0;background:var(--surface);padding:8px 12px;cursor:pointer;font-size:13px;border-left:1px solid var(--line-2);color:var(--ink-2)}
.diff-seg button:first-child{border-left:0}
.diff-seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.filters .spacer{flex:1 1 0}
.count{font-size:13.5px;color:var(--ink-2)}
.count b{font-family:var(--f-en);font-size:18px;color:var(--ink)}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.tcard{padding:22px;display:flex;flex-direction:column;gap:14px}
.tcard.featured{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.tc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tc-no{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-3)}
.tc-cat{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:500}
.tc-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.stars{font-size:13px;letter-spacing:.1em;color:var(--warn)}
.stars small{font-size:11px;color:var(--ink-3);letter-spacing:.04em;margin-right:6px;font-family:var(--f-mono)}
.tc-text{font-family:var(--f-en);font-size:15px;line-height:1.7;flex:1}
.tc-text .qq{display:block;margin-top:6px;color:var(--ink-2);font-style:italic}
.tc-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc-btns .btn{font-size:13px;padding:9px 10px}
.random-box{display:flex;flex-direction:column;gap:12px}
.empty{padding:40px;text-align:center;color:var(--ink-3)}

/* ---------- ideas page ---------- */
.idea-top{padding:26px 28px;display:flex;flex-direction:column;gap:16px}
.idea-topic{font-family:var(--f-en);font-size:18px;line-height:1.65}
.think{padding:26px 28px;display:flex;flex-direction:column;gap:14px}
.think textarea{min-height:120px;font-size:15px}
.flow{display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);align-items:center}
.flow span.on{color:var(--accent);font-weight:700}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.icard{padding:24px;display:flex;flex-direction:column;gap:12px}
.icard .ih{display:flex;justify-content:space-between;align-items:center;gap:8px}
.icard .ino{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--ink-3)}

function overallBand(bands){
  const v=bands.filter(b=>typeof b==="number");
  if(!v.length) return null;
  const avg=v.reduce((a,b)=>a+b,0)/v.length;
  const f=Math.floor(avg),r=avg-f;
  return r>=0.75?f+1:r>=0.25?f+0.5:f;
}

/* ---- image helpers (Task 1) ---- */
async function processImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
    const mk=(max,q)=>{
      const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));
      const x=c.getContext("2d");x.fillStyle="#ffffff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      return c.toDataURL("image/jpeg",q);
    };
    return {full:mk(1800,0.92),thumb:mk(900,0.85),name:file.name||"pasted-image",w:img.naturalWidth,h:img.naturalHeight};
  }finally{URL.revokeObjectURL(url)}
}
function dataUrlToBlob(d){
  const [head,body]=d.split(",");const mime=(head.match(/data:([^;]+)/)||[])[1]||"image/jpeg";
  const bin=atob(body);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:mime});
}
async function handleImage(file){
  S.imgError="";
  if(!file) return;
  if(!/^image\/(jpeg|jpg|png|webp|gif)$/i.test(file.type)){S.imgError="JPG / JPEG / PNG / WebP / GIF の画像を選んでください。";render();return}
  if(file.size>20*1024*1024){S.imgError="画像が大きすぎます（20MBまで）。";render();return}
  try{
    S.t1Image=await processImage(file);S.t1Points=null;
    if(!store.set("t1Image",S.t1Image)) S.imgError="画像は使えますが、このブラウザには保存できませんでした（ページを閉じると消えます）。";
  }catch(e){S.imgError="画像を読み込めませんでした。別のファイルでお試しください。"}
  render();
}
async function imagesSupported(sample){

}
/* Highlighted corrections are split into one span per word (and per space).
   Each span stays on one line, so long corrections wrap naturally in reading
   order, and the background is drawn per word — also when html2canvas turns
   the sheet into a PDF (it paints a multi-line inline background as one big
   box, which caused the covered text). */
function hlWords(t){
  return String(t).split(/(\s+)/).map(x=>!x?"":/^\s+$/.test(x)?'<span class="sp"> </span>':'<span class="w">'+esc(x)+"</span>").join("");
}
function renderInline(par){
  let out="",last=0;const re=/\[\[([\s\S]*?)\|\|([\s\S]*?)\]\]/g;let m;
  while((m=re.exec(par))){
    out+=esc(par.slice(last,m.index));
    const a=m[1].trim(),b=m[2].trim();
    out+='<span class="fix">'+(a?"<del>"+hlWords(a)+"</del>":"")+(a&&b?" ":"")+(b?"<ins>"+hlWords(b)+"</ins>":"")+"</span>";
    last=re.lastIndex;
  }
  return out+esc(par.slice(last));
}
function renderAnnotated(s){
  return String(s||"").trim().split(/\n\s*\n/).map(par=>"<p>"+renderInline(par).replace(/\n/g,"<br>")+"</p>").join("");
}

function wcBlock(){
  const n=wordCount(S.answer),min=minWords(S.task),under=n<min;
  const pct=Math.min(100,Math.round(n/min*100));
  return `<div class="wc ${under?"under":""}" id="wc">
    <span class="num">Word Count：<b>${n}</b>words</span>
    <span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span>
    <span class="state">${under?`${min}語を下回っています（あと${min-n}語）`:`${min}語以上をクリア`}</span>

}

function bindImage(){
  const drop=$("#drop"),fi=$("#fileIn");
  if(fi) fi.addEventListener("change",()=>handleImage(fi.files[0]));

    drop.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();fi.click()}});
    drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over")});
    drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
    drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("over");handleImage(e.dataTransfer.files[0])});
  }

function chartInfoText(){
  const q=S.t1Quick||{},kind=quickKind(q.type),v=k=>String(q[k]||"").trim();
  const L=[];
  if(kind==="graph"){
    if(v("from")||v("to")) L.push(`Period: ${v("from")} – ${v("to")}`);
    if(v("cats")) L.push(`Categories: ${v("cats")}`);
    if(v("data")) L.push(`Main data:\n${v("data")}`);
    if(v("features")) L.push(`Main features:\n${v("features")}`);
  }else if(kind==="map"){
    if(v("from")||v("to")) L.push(`Before: ${v("from")} / After: ${v("to")}`);
    if(v("places")) L.push(`Places / areas: ${v("places")}`);
    if(v("changes")) L.push(`Main changes:\n${v("changes")}`);
    if(v("same")) L.push(`Unchanged:\n${v("same")}`);
  }else{
    if(v("start")) L.push(`Start: ${v("start")}`);
    if(v("end")) L.push(`End: ${v("end")}`);
    if(v("steps")) L.push(`Main steps in order:\n${v("steps")}`);
    if(v("notes")) L.push(`Notes:\n${v("notes")}`);
  }
  const free=String(S.t1Info||"").trim();
  if(free) L.push(`Additional information:\n${free}`);
  if(!L.length) return "";
  return `Chart type: ${q.type||"Other"}\n`+L.join("\n");
}

  const t=chartInfoText().replace(/^Chart type:.*\n?/,"").replace(/^[A-Za-z /]+:\s*/gm,"").trim();

function scaleBlock(b){
  const vals=[];for(let v=3;v<=9;v+=0.5) vals.push(v);
  return `<div class="scale" aria-label="Band scale">
    <div class="track">${vals.map(v=>`<i class="${v===b?"cur":v<b?"fill":""}"></i>`).join("")}</div>
    <div class="ticks">${vals.map(v=>`<span>${v%1===0?v:""}</span>`).join("")}</div>
  </div>`;
}
const OV_MAP={"ある":["good","✓ あり"],"弱い":["fair","△ 弱い"],"不十分":["poor","△ 不十分"],"ない":["poor","✕ なし"]};
const ST_MARK={good:"✓",fair:"△",poor:"✕"};
const LIMITED_MSG="図表の情報が十分でないため、Data AccuracyとKey Featuresについては限定的な評価です。";
const BASIS={A:"図表画像＋問題文＋答案",B:"図表の情報（入力）＋問題文＋答案",C:"問題文＋答案のみ"};
function t1Stat(t){
  const ov=OV_MAP[t.overview.level]||["fair","△ "+(t.overview.level||"要確認")];
  const kfo=t.keyFeatures;
  let kf;
  if(!kfo) kf={cls:"na",text:"評価情報不足"};
  else{const r=kfo.identified/kfo.total;kf={cls:t.limited?"na":r>=0.75?"good":r>=0.5?"fair":"poor",text:`${kfo.identified} / ${kfo.total} identified${t.limited?"（参考）":""}`}}
  const ne=t.dataErrors.length;
  let da;
  if(t.level==="C") da={cls:"na",text:"評価情報不足",sub:"図表のデータがないため照合していません"};
  else if(ne) da={cls:"poor",text:`⚠ ${ne} error${ne>1?"s":""}`,sub:"下の DATA ERROR を確認してください"};
  else if(t.limited) da={cls:"na",text:"限定的な評価",sub:"入力された範囲では誤りは見つかりませんでした"};
  else da={cls:"good",text:"✓ No errors",sub:"数値・順位・増減は図表と一致しています"};
  return {ov,kf,da,ne};
}
function typeLabel(tp){return String(tp||"OTHER").replace(/_/g," ")}

    ${t.level==="C"&&!t.covered.length&&!t.missed.length?"":`<div class="cm">

    </div>`}
  </section>`;
}

function stars(d){return "★".repeat(d)+"☆".repeat(3-d)}
function filtered(){

function ideaSheetData(){
  const t1=S.ideaMode==="t1";
  if(t1){
    const P=S.t1Points;
    return {
      t1:true,
      meta:["Writing Task 1",P?typeLabel(P.type):(S.t1Quick&&S.t1Quick.type)||"","20 minutes","150 words"].filter(Boolean),
      question:S.q1.trim(),
      image:S.t1Image?S.t1Image.full:null,
      chartInfo:S.t1Image?"":chartInfoText(),
      ideas:P?P.points.map((p,i)=>({no:i+1,side:i===0?"Overview":"Key point",title:p.title,explain:p.detail,useful:p.useful})):[],
      file:"IELTS_Task1_Practice"
    };
  }
  const it=S.ideaTopic,t=it.id?TOPICS[it.id-1]:null;
  return {
    t1:false,
    meta:t?[`No.${t.no}`,t.cat.toUpperCase(),TYPE_LABEL[t.type],"Difficulty "+stars(t.diff),"40 minutes","250 words"]:["Writing Task 2","40 minutes","250 words"],
    question:it.text,
    ideas:(S.ideasShown&&S.ideas?S.ideas:[]).map((d,i)=>({no:i+1,side:d.side,title:d.title,explain:d.explain,useful:(Array.isArray(d.useful)?d.useful:[d.useful]).filter(Boolean)})),
    file:t?`IELTS_Task2_No${t.no}`:"IELTS_Task2_Practice"

}

async function saveIdeaPdf(btn){
  btn.disabled=true;btn.textContent="PDFを作成中…";
  const host=document.createElement("div");
  host.style.cssText="position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1";
  document.body.appendChild(host);
  try{
    await fontsReady();
    if(typeof html2canvas!=="function") throw new Error("nolib");
    const pg=mountIdeaSheet(host);
    const c=await html2canvas(pg,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:1200});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    pdf.addImage(c.toDataURL("image/jpeg",0.95),"JPEG",0,0,210,297);
    host.remove();
    await saveIdeaFile(ideaSheetData().file+".pdf",pdf.output("blob"));
  }catch(e){host.remove();S.isMsg="!PDFを作成できませんでした。「印刷用ファイルを保存」をお試しください。";render()}
}
async function saveIdeaHtml(){
  await fontsReady();
  const host=document.createElement("div");
  host.style.cssText="position:fixed;left:-10000px;top:0;width:794px";
  document.body.appendChild(host);
  let html="";
  try{html=mountIdeaSheet(host).outerHTML}finally{host.remove()}
  await saveIdeaFile(ideaSheetData().file+".html",printableHtml(html,ideaSheetData().file,ISHEET_CSS));
}
async function saveIdeaFile(filename,data){
  const dl=await getDownloads();
  if(!dl){S.isMsg="!この画面ではファイル保存を利用できません。";render();return}
  try{await dl.save({filename,data});S.isMsg=`${filename} を保存しました。`}
  catch(e){S.isMsg=e&&e.code==="declined"?"保存をキャンセルしました。":"!ファイルを保存できませんでした。"}
  render();
}
function bindIdeaSheet(){
  const w=$("#ideaSheetWrap");if(!w) return;

  const cb=$("#isIdeas");if(cb) cb.addEventListener("change",()=>{S.isIdeas=cb.checked;mountIdeaSheet($("#ideaSheetWrap"))});
  const b1=$("#isPdf");if(b1) b1.addEventListener("click",e=>saveIdeaPdf(e.currentTarget));
  const b2=$("#isHtml");if(b2) b2.addEventListener("click",saveIdeaHtml);
}

const FOOT_NOTE="※ このBandは公式のIELTSスコアではなく、学習目的の推定評価です。";

function bandsHtml(r){

  </div>`;
}
function kpHtml(r){
  return `<div class="sh-box"><span class="sh-lbl">今回覚えてほしい3ポイント</span><div class="sh-kp">${(r.keyPoints||[]).slice(0,3).map((k,i)=>`<div><b>0${i+1}</b><span>${esc(k)}</span></div>`).join("")}</div></div>`;
}
/* blocks before the essay (page 1 top) */
function sheetHeadBlocks(r,name,date){
  const task=r.task,wc=r.wc??wordCount(r.answer),q=String(r.question||"");
  const qHtml=esc(q).replace(/\n/g,"<br>");

    const t=r.task1,st=t1Stat(t);
    return [
      shHeadHtml(1,name,date),

        <div class="sh-box"><span class="sh-lbl">Task 1 Question</span><div class="sh-topic">${qHtml||"—"}</div></div>
        <div class="sh-box"><span class="sh-lbl">Word Count</span><div class="sh-wc">${wc}<small>words（目安 150語以上）</small></div></div>

    </div>`,
    bandsHtml(r)
  ];
}
/* blocks after the essay */
function sheetAfterBlocks(r){
  if(r.task===1&&r.task1){
    const t=r.task1;
    return [`<div class="sh-bottom">
      <div class="sh-box sh-miss"><span class="sh-lbl">見落としていた重要ポイント</span><ul>${(t.missed.length?t.missed:[t.limited?"図表の情報が不足しているため判定していません":"大きな見落としはありません"]).slice(0,4).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>

function essayBoxHtml(cont){
  return `<div class="sh-box sh-essay-box"><span class="sh-lbl">添削された英文${cont?"（続き）":""}<span class="sh-legend">赤＝修正前　緑＝修正後</span></span><div class="sh-essay"></div></div>`;
}
/* Q&A blocks: one question = several small blocks so long answers can move to the next page */
function qaBlocks(item,i){
  const no=String(i+1).padStart(2,"0");
  const out=[];
  out.push(`<div class="qa-block${i?" qa-gap":""}">
    <div class="qa-q"><div class="qh">QUESTION ${no}</div><div class="qt">${esc(item.question)}</div></div>
    <div class="qa-a"><span class="qa-lbl">COACH’S ANSWER</span><div class="qa-main">${esc(item.answer)}</div></div>
  </div>`);
  if(item.explanation) out.push(`<div class="qa-a"><span class="qa-lbl">解説</span><div class="qa-p">${esc(item.explanation)}</div></div>`);
  if(item.examples.length) out.push(`<div class="qa-ex"><span class="qa-lbl">英文例</span>${item.examples.map(e=>`<div class="qa-exi">${e.before?`<div class="b"><span>×</span>${esc(e.before)}</div>`:""}${e.after?`<div class="a"><span>○</span>${esc(e.after)}</div>`:""}${e.note?`<div class="n">${esc(e.note)}</div>`:""}</div>`).join("")}</div>`);
  if(item.advice) out.push(`<div class="qa-adv"><span class="qa-lbl">次回の英作文で</span><div>${esc(item.advice)}</div></div>`);
  return out;
}
function runHeadHtml(kind,name,date){
  const who=[name,date].filter(Boolean).map(esc).join(" · ");
  if(kind==="cont") return `<div class="sh-run"><span>IELTS Writing Feedback Sheet（続き）</span><span>${who}</span></div>`;
  if(kind==="qa-first") return `<div class="qa-head">
      <div><span class="sh-sub">IELTS Writing Feedback Sheet · Q&amp;A</span><div class="sh-title">Student Questions &amp; Coach’s Answers</div><div class="qa-subt">あなたの疑問に答える個別フィードバック</div></div>
      <div class="sh-who"><span>Name</span><span>${esc(name)}</span><span>Date</span><span>${esc(date)}</span></div>
    </div>`;
  if(kind==="qa") return `<div class="sh-run"><span>Student Questions &amp; Coach’s Answers（続き）</span><span>${who}</span></div>`;
  return "";
}
/* split one paragraph (with [[a||b]] markers) into sentences, never inside a marker */
function splitSentences(par){
  const out=[];let cur="";
  const re=/\[\[[\s\S]*?\|\|[\s\S]*?\]\]/g;let last=0,m;
  const pushText=t=>{const pieces=t.split(/(?<=[.!?])\s+/);pieces.forEach((pc,i)=>{cur+=pc;if(i<pieces.length-1){if(cur.trim()) out.push(cur.trim());cur=""}})};
  while((m=re.exec(par))){pushText(par.slice(last,m.index));cur+=m[0];last=re.lastIndex}
  pushText(par.slice(last));
  if(cur.trim()) out.push(cur.trim());
  return out;
}
function paginateSheet(container,r,name,date){
  container.innerHTML="";
  const pages=[];let cur=null;
  const newPage=kind=>{
    const pg=document.createElement("div");
    pg.className="sheet page";
    pg.innerHTML=`${runHeadHtml(kind,name,date)}<div class="pg-body"></div><div class="sh-foot"><span>${FOOT_NOTE}</span><span class="pg-no"></span></div>`;
    container.appendChild(pg);
    cur={pg,body:pg.querySelector(".pg-body")};pages.push(cur);
  };
  const over=()=>cur.body.scrollHeight>cur.body.clientHeight+1;
  const make=html=>{const t=document.createElement("div");t.innerHTML=html.trim();return t.firstElementChild};
  const add=(html,kind)=>{
    const el=make(html);cur.body.appendChild(el);
    if(over()&&cur.body.children.length>1){cur.body.removeChild(el);newPage(kind);cur.body.appendChild(el)}
    return el;
  };
  newPage("first");
  sheetHeadBlocks(r,name,date).forEach(h=>add(h,"cont"));
  // essay: flow sentence by sentence
  let box=add(essayBoxHtml(false),"cont"),ess=box.querySelector(".sh-essay");
  const paras=String(r.annotated||r.answer||"").trim().split(/\n\s*\n/);
  for(const par of paras){
    let p=document.createElement("p");ess.appendChild(p);
    for(const s of splitSentences(par.replace(/\s*\n\s*/g," "))){
      const sp=document.createElement("span");sp.className="sent";sp.innerHTML=renderInline(s)+" ";
      p.appendChild(sp);
      if(!over()) continue;
      p.removeChild(sp);
      const onlyBoxOnPage=cur.body.children.length===1&&cur.body.firstElementChild===box;
      if(onlyBoxOnPage&&!ess.textContent.trim()){p.appendChild(sp);continue} // nothing more can be done: keep
      if(!p.childNodes.length) ess.removeChild(p);
      if(!ess.childNodes.length) cur.body.removeChild(box);
      newPage("cont");
      box=add(essayBoxHtml(true),"cont");ess=box.querySelector(".sh-essay");
      p=document.createElement("p");ess.appendChild(p);p.appendChild(sp);
    }
  }
  sheetAfterBlocks(r).forEach(h=>add(h,"cont"));
  const qa=Array.isArray(r.qa)?r.qa:[];
  if(qa.length){
    newPage("qa-first");
    qa.forEach((it,i)=>qaBlocks(it,i).forEach(h=>add(h,"qa")));
  }
  pages.forEach((p,i)=>{p.pg.querySelector(".pg-no").textContent=`IELTS Writing Coach · ${i+1} / ${pages.length}`});
  return pages.map(p=>p.pg);
}
(function(){const st=document.createElement("style");st.textContent=SHEET_CSS;document.head.appendChild(st)})();

function viewSheet(){
  const r=S.result;

  </header>
  <div class="card sheet-tools">
    <div class="f"><label class="label" for="sName">生徒名</label><input id="sName" value="${esc(S.sheetName)}" placeholder="例：Yamada Hana"></div>
    <div class="f"><label class="label" for="sDate">日付</label><input id="sDate" value="${esc(S.sheetDate)}"></div>

    </div>

  </div>
  ${S.sheetMsg?`<div class="notice ${S.sheetMsg.startsWith("!")?"bad":"info"}" id="sheetMsg"><span>i</span><span>${esc(S.sheetMsg.replace(/^!/,""))}</span></div>`:`<p class="note">「印刷 / PDF保存」はA4のPDFを作成します（プレビューと同じページ割り）。紙に印刷する場合は、そのPDFを開いて印刷してください。「印刷用ファイル」はブラウザで開くと印刷画面が表示されます。</p>`}
  <div class="sheet-wrap" id="sheetWrap"></div>

async function fontsReady(){try{await (document.fonts?document.fonts.ready:Promise.resolve())}catch(e){}}
async function renderSheetPreview(){
  const wrap=$("#sheetWrap");if(!wrap) return;
  paginateSheet(wrap,S.result,S.sheetName,S.sheetDate);
  await fontsReady();
  const w=$("#sheetWrap");if(w) paginateSheet(w,S.result,S.sheetName,S.sheetDate);

/* build pages off-screen and capture each page as its own canvas */
async function captureSheetPages(){
  await fontsReady();
  if(typeof html2canvas!=="function") throw new Error("nolib");
  const host=document.createElement("div");
  host.style.cssText="position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1";
  document.body.appendChild(host);
  try{
    const pages=paginateSheet(host,S.result,S.sheetName,S.sheetDate);
    const canvases=[];
    for(const pg of pages) canvases.push(await html2canvas(pg,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:1200}));
    return canvases;
  }finally{host.remove()}
}
function sheetFileBase(){
  const n=(S.sheetName||"student").replace(/[\\/:*?"<>|]+/g,"").trim()||"student";
  return `IELTS_Feedback_${n}_${S.sheetDate||today()}`;
}
function setSheetMsg(m){S.sheetMsg=m;render()}
async function saveFile(filename,data){
  const dl=await getDownloads();
  if(!dl){setSheetMsg("!この画面ではファイル保存を利用できません。");return}
  try{
    await dl.save({filename,data});
    setSheetMsg(`${filename} を保存しました。`);
  }catch(e){
    if(e&&e.code==="declined") setSheetMsg("保存をキャンセルしました。");
    else if(e&&e.code==="rate_limited") setSheetMsg("!保存の確認画面がすでに開いています。少し待ってからお試しください。");
    else setSheetMsg("!ファイルを保存できませんでした。");
  }
}
async function buildPdfBlob(){
  const canvases=await captureSheetPages();
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  canvases.forEach((c,i)=>{if(i) pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.95),"JPEG",0,0,210,297)});
  return pdf.output("blob");
}
async function savePdf(btn){
  btn.disabled=true;btn.textContent="PDFを作成中…";
  try{await saveFile(sheetFileBase()+".pdf",await buildPdfBlob())}
  catch(e){setSheetMsg("!PDFを作成できませんでした。「印刷用ファイルを保存」をお試しください。")}
}
async function savePng(btn){
  btn.disabled=true;btn.textContent="画像を作成中…";
  try{
    const cs=await captureSheetPages();
    const gap=48,W=cs[0].width,H=cs.reduce((a,c)=>a+c.height,0)+gap*(cs.length-1);
    const out=document.createElement("canvas");out.width=W;out.height=H;
    const x=out.getContext("2d");x.fillStyle="#e9edf0";x.fillRect(0,0,W,H);
    let y=0;cs.forEach(c=>{x.drawImage(c,0,y);y+=c.height+gap});
    const blob=await new Promise(res=>out.toBlob(res,"image/png"));
    await saveFile(sheetFileBase()+".png",blob);
  }catch(e){setSheetMsg("!画像を作成できませんでした。")}
}

function roundBand(b){const n=Number(b);if(!isFinite(n)) return null;return Math.max(0,Math.min(9,Math.round(n*2)/2))}
function normalizeT1(t,level){
  t=t||{};const arr=x=>Array.isArray(x)?x:[];
  const limited=level==="C"||t.infoSufficient===false;
  const kfRaw=t.keyFeatures;
  let keyFeatures=null;
  if(kfRaw&&level!=="C"&&Number(kfRaw.total)>0){
    let total=Math.round(Number(kfRaw.total)),idn=Math.max(0,Math.round(Number(kfRaw.identified)||0));
    if(idn>total) idn=total;
    keyFeatures={identified:idn,total,comment:String(kfRaw.comment||"")};
  }
  return {
    level,limited,
    type:String(t.type||"OTHER").toUpperCase(),
    imageSummary:String(t.imageSummary||""),
    overview:{level:String(t.overview?.level||"").replace(/\s/g,""),comment:String(t.overview?.comment||"")},
    keyFeatures,
    dataErrors:level==="C"?[]:arr(t.dataErrors).filter(e=>e&&(e.student||e.chart)).map(e=>({student:String(e.student||""),chart:String(e.chart||""),note:String(e.note||"")})),
    checks:arr(t.checks).filter(c=>c&&c.label).slice(0,5).map(c=>({label:String(c.label),status:["good","fair","poor"].includes(c.status)?c.status:"fair",verdict:String(c.verdict||""),comment:String(c.comment||"")})),
    covered:arr(t.covered).map(String),
    missed:arr(t.missed).map(String)
  };
}
function normalizeResult(d,base,level){
  const arr=x=>Array.isArray(x)?x:[];
  const byKey={};arr(d.criteria).forEach(c=>{if(c&&c.key) byKey[String(c.key).toUpperCase().replace("TA","TR")]=c});
  const criteria=["TR","CC","LR","GRA"].map(k=>{const c=byKey[k]||{};return{key:k,band:roundBand(c.band),reason:String(c.reason||""),strengths:arr(c.strengths).map(String),improvements:arr(c.improvements).map(String),examples:arr(c.examples).filter(e=>e&&e.quote).map(e=>({quote:String(e.quote),comment:String(e.comment||"")}))}});
  if(criteria.some(c=>c.band===null)) throw {code:"invalid_json"};
  return Object.assign({},base,{
    criteria,
    overall:overallBand(criteria.map(c=>c.band)),
    summary:String(d.summary||""),
    top3:arr(d.top3).slice(0,3).map(t=>({title:String(t.title||""),detail:String(t.detail||""),evidence:String(t.evidence||"")})),
    annotated:String(d.annotated||base.answer),
    corrections:arr(d.corrections).map(c=>({before:String(c.before||""),after:String(c.after||""),category:String(c.category||"Grammar"),note:String(c.note||"")})).filter(c=>c.before||c.after),
    keyPoints:arr(d.keyPoints).slice(0,3).map(String),
    ideas:{used:arr(d.ideas?.used).map(u=>({idea:String(u.idea||""),note:String(u.note||"")})),others:arr(d.ideas?.others).map(o=>({idea:String(o.idea||""),note:String(o.note||""),useful:String(o.useful||"")}))},
    task1:base.task===1?normalizeT1(d.task1,level||"A"):null,
    qa:base.studentQ?arr(d.qa).filter(q=>q&&(q.question||q.answer)).map(q=>({question:String(q.question||""),answer:String(q.answer||""),explanation:String(q.explanation||""),examples:arr(q.examples).filter(e=>e&&(e.before||e.after)).map(e=>({before:String(e.before||""),after:String(e.after||""),note:String(e.note||"")})),advice:String(q.advice||"")})):[]

let gradeCtl=null,gradeTimer=null;
async function grade(){
  S.gradeError="";
  const t1=S.task===1;
  const q=curQ().trim(),a=S.answer.trim(),wc=wordCount(a);
  if(!t1&&!q){S.gradeError="QUESTION / TOPIC に問題文を貼り付けてください。";render();return}
  if(wc<40){S.gradeError="答案が短すぎます（40語以上の英文を貼り付けてください）。";render();return}
  if(wc>1500){S.gradeError="答案が長すぎます。1,500語以内に収めてください。";render();return}
  const sample=await getSample();
  if(!sample){S.gradeError="この画面ではAIによる採点を利用できません。";render();return}
  // Task 1: decide the evaluation level from what is available (never stop because of the image)
  const info=t1?chartInfoText():"";
  const infoOk=t1&&hasChartInfo();
  let useImg=t1&&!!S.t1Image&&await imagesSupported(sample);
  const levelOf=img=>img?"A":infoOk?"B":"C";
  const qText=q||"(The question text was not provided.)";
  const sq=String(S.studentQ||"").trim();
  S.grading=true;S.gradeStart=Date.now();S.gradeChars=0;render();
  gradeTimer=setInterval(()=>{const el=$("#gsec");if(el) el.textContent=Math.floor((Date.now()-S.gradeStart)/1000)+"秒経過"},1000);
  gradeCtl=new AbortController();
  let lastStep=0;
  const onText=({text})=>{S.gradeChars=text.length;const st=text.length>2500?2:1;if(st!==lastStep){lastStep=st;if(S.page==="write"){const p=$("#progress");if(p) p.outerHTML=progressBlock()}bindStop()}};
  const run=img=>{
    const opts={modelTier:"complex",signal:gradeCtl.signal,onText};
    if(img) opts.images=dataUrlToBlob(S.t1Image.full);
    return sample.json(gradePrompt(S.task,qText,a,wc,{level:levelOf(img),info,questions:sq}),opts);
  };
  try{
    let data;
    try{data=await run(useImg)}
    catch(e){
      // image could not be used: fall back once to Level B / C instead of stopping
      if(useImg&&e&&["image_rejected","images_unavailable","invalid_request","transform_error"].includes(e.code)){useImg=false;S.gradeChars=0;lastStep=0;data=await run(false)}
      else throw e;
    }
    const level=t1?levelOf(useImg):null;
    const base={id:String(Date.now()),date:today(),task:S.task,question:q,answer:a,wc,image:t1&&S.t1Image?S.t1Image.thumb:null,chartInfo:info,studentQ:sq};
    const r=normalizeResult(data,base,level);
    S.history=[r,...S.history].slice(0,10);saveHistory();
    S.result=r;S.grading=false;clearInterval(gradeTimer);
    go("result");
  }catch(e){
    S.grading=false;clearInterval(gradeTimer);
    if(!(e&&e.code==="cancelled")) S.gradeError=errCopy(e&&e.code);
    render();
  }
}
function bindStop(){const s=$("#stop");if(s) s.onclick=()=>gradeCtl&&gradeCtl.abort()}

  const sample=await getSample();
  if(!sample){S.t1Error="この画面ではAIによる分析を利用できません。";render();return}
  const info=chartInfoText(),infoOk=hasChartInfo();
  let useImg=!!S.t1Image&&await imagesSupported(sample);
  if(!useImg&&!infoOk){S.t1Error="③ CHART / DIAGRAM INFORMATION に、グラフの種類・期間・主な数値などを入力すると、書くべき内容を提示できます（簡単入力が便利です）。";render();return}
  S.t1Busy=true;render();
  const run=img=>sample.json(t1IdeaPrompt(S.q1.trim(),info,img),img?{images:dataUrlToBlob(S.t1Image.full)}:{});
  try{
    let d;
    try{d=await run(useImg)}
    catch(e){if(useImg&&infoOk&&e&&["image_rejected","images_unavailable","invalid_request","transform_error"].includes(e.code)){d=await run(false)}else throw e}
    const pts=(Array.isArray(d?.points)?d.points:[]).filter(p=>p&&p.title).slice(0,5).map(p=>({title:String(p.title),detail:String(p.detail||""),useful:(Array.isArray(p.useful)?p.useful:[p.useful]).filter(Boolean).map(String)}));
    if(!pts.length) throw {code:"invalid_json"};
    S.t1Points={type:String(d.type||"OTHER").toUpperCase(),imageSummary:String(d.imageSummary||""),points:pts};
  }catch(e){if(!(e&&e.code==="cancelled")) S.t1Error=errCopy(e&&e.code)}
  S.t1Busy=false;render();
}
function setIdeaTopic(id,text){
  S.ideaTopic={id,text};store.set("ideaTopic",S.ideaTopic);
  S.ideasShown=false;S.ideas=null;S.ideaMemo="";S.ideaError="";
}
function useTopicForWriting(id,text){
  S.question=text;S.topicId=id;S.task=2;
  if(S.isSampleDraft){S.answer="";S.isSampleDraft=false}
  saveDraft();go("write");
}

/* =========================================================
   Event binding
   ========================================================= */
function bind(){
  const on=(sel,ev,fn)=>{const el=$(sel);if(el) el.addEventListener(ev,fn)};
  if(S.page==="write"){
    on("#t1","click",()=>{S.task=1;S.gradeError="";if(S.isSampleDraft){S.answer="";S.isSampleDraft=false}saveDraft();render()});
    on("#t2","click",()=>{S.task=2;S.gradeError="";saveDraft();render()});
    on("#q","input",e=>{if(S.task===1) S.q1=e.target.value; else {S.question=e.target.value;S.topicId=null}saveDraft()});
    on("#toT1Ideas","click",()=>{S.ideaMode="t1";store.set("ideaMode","t1");go("ideas")});
    bindImage();bindChartInfo();
    on("#ans","input",e=>{S.answer=e.target.value;if(S.isSampleDraft){S.isSampleDraft=false}saveDraft();$("#wc").outerHTML=wcBlock()});
    on("#clearAns","click",()=>{S.answer="";S.isSampleDraft=false;saveDraft();render();$("#ans").focus()});
    on("#pickTopic","click",()=>go("topics"));
    on("#toIdeas","click",()=>{S.ideaMode="t2";store.set("ideaMode","t2");if(S.question.trim()&&S.question.trim()!==S.ideaTopic.text.trim()) setIdeaTopic(S.topicId,S.question.trim());go("ideas")});
    on("#sq","input",e=>{S.studentQ=e.target.value;saveDraft()});
    on("#grade","click",grade);
    bindStop();
    document.querySelectorAll("[data-hist]").forEach(b=>b.addEventListener("click",()=>{S.result=S.history[+b.dataset.hist];go("result")}));
  }
  if(S.page==="result"){
    on("#makeSheet","click",()=>{S.sheetMsg="";go("sheet")});
    on("#makeSheet2","click",()=>{S.sheetMsg="";go("sheet")});
    on("#nextTopic","click",()=>go("topics"));
  }
  if(S.page==="topics"){
    on("#fCat","change",e=>{S.filters.cat=e.target.value;render()});
    on("#fType","change",e=>{S.filters.type=e.target.value;render()});
    document.querySelectorAll("#fDiff button").forEach(b=>b.addEventListener("click",()=>{S.filters.diff=+b.dataset.d;render()}));
    on("#fQ","input",e=>{S.filters.q=e.target.value;const pos=e.target.selectionStart;render();const f=$("#fQ");f.focus();try{f.setSelectionRange(pos,pos)}catch(_){}});
    on("#random","click",()=>{const l=filtered();const pool=l.length?l:TOPICS;let t;do{t=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&t.id===S.featured);S.featured=t.id;render();window.scrollTo({top:0})});
    document.querySelectorAll("[data-write]").forEach(b=>b.addEventListener("click",()=>{const t=TOPICS[+b.dataset.write-1];useTopicForWriting(t.id,topicText(t))}));
    document.querySelectorAll("[data-idea]").forEach(b=>b.addEventListener("click",()=>{const t=TOPICS[+b.dataset.idea-1];S.ideaMode="t2";store.set("ideaMode","t2");setIdeaTopic(t.id,topicText(t));go("ideas")}));
  }
  if(S.page==="ideas"){
    bindIdeaSheet();
    on("#modeT1","click",()=>{S.ideaMode="t1";store.set("ideaMode","t1");render()});
    on("#modeT2","click",()=>{S.ideaMode="t2";store.set("ideaMode","t2");render()});
    on("#iq1","input",e=>{S.q1=e.target.value;saveDraft()});
    on("#t1memo","input",e=>{S.t1Memo=e.target.value});
    on("#showT1","click",showT1Points);
    on("#t1Write","click",()=>{S.task=1;if(S.isSampleDraft){S.answer="";S.isSampleDraft=false}saveDraft();go("write")});
    bindImage();bindChartInfo();
    on("#memo","input",e=>{S.ideaMemo=e.target.value});
    on("#showIdeas","click",showIdeas);
    on("#ideaWrite","click",()=>useTopicForWriting(S.ideaTopic.id,S.ideaTopic.text));
    on("#ideaPick","click",()=>go("topics"));
    on("#ideaCustomBtn","click",()=>{const b=$("#customBox");b.hidden=!b.hidden;if(!b.hidden) $("#customTopic").focus()});
    on("#customSet","click",()=>{const v=$("#customTopic").value.trim();if(!v) return;const hit=TOPICS.find(t=>topicText(t).replace(/\s+/g," ")===v.replace(/\s+/g," "));setIdeaTopic(hit?hit.id:null,v);render()});
  }
  if(S.page==="sheet"){
    on("#sName","input",e=>{S.sheetName=e.target.value;paginateSheet($("#sheetWrap"),S.result,S.sheetName,S.sheetDate)});
    on("#sDate","input",e=>{S.sheetDate=e.target.value;paginateSheet($("#sheetWrap"),S.result,S.sheetName,S.sheetDate)});
    renderSheetPreview();
    on("#savePdf","click",e=>savePdf(e.currentTarget));
    on("#savePng","click",e=>savePng(e.currentTarget));
    on("#saveHtml","click",saveHtml);
    on("#backRes","click",()=>go("result"));
  }
}

render();
getDownloads();
getSample();
</script>
